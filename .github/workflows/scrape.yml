# Runs the audition scraper daily and on manual trigger.
#
# How GitHub Actions works:
#   - "on" defines what triggers this workflow
#   - "schedule" uses cron syntax (UTC time): "0 12 * * *" = noon UTC = 8am ET
#   - "workflow_dispatch" adds a "Run workflow" button in the GitHub UI (useful for testing)
#   - "jobs" defines what to run — each job gets a fresh virtual machine
#   - "steps" are the individual commands within a job
#   - "secrets" are encrypted values you set in GitHub repo settings

name: Daily Scrape

on:
  schedule:
    - cron: '0 12 * * *'   # noon UTC = 8am ET every day
  workflow_dispatch:         # also allows manual runs from the GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest  # free Linux VM provided by GitHub

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        # "uses" runs a pre-built action from the GitHub marketplace.
        # actions/checkout just clones your repo onto the VM.

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'       # caches node_modules between runs to speed things up

      - name: Install dependencies
        run: npm ci
        # "run" executes a shell command. npm ci is like npm install
        # but faster and stricter — designed for CI environments.

      - name: Run scraper
        run: npx tsx scraper/index.ts
        env:
          # These reference secrets you'll set in GitHub repo settings.
          # They're never visible in logs or to other workflows.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
